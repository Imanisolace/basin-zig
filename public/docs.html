<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basin - Immutable Ledger API</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c2F2aW5nLXNvbGUtOTguY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://jsdelivr.net"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #ddd; margin: 0; padding: 0; line-height: 1.6; }
  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  nav { padding: 20px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  nav a { color: #888; margin: 0 15px; text-decoration: none; font-weight: 500; cursor: pointer; }
  nav a:hover { color: #fff; }
  .card { background: #111; padding: 25px; border-radius: 12px; margin-top: 20px; border: 1px solid #222; }
  .pricing { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
  .plan { background: #111; padding: 25px; border-radius: 12px; flex: 1; border: 1px solid #333; min-width: 280px; }
  .plan.pro { border: 2px solid #4f46e5; background: #0f0f1a; }
  .btn { background: #4f46e5; color: #fff; padding: 12px 24px; border: none; border-radius: 8px; text-decoration: none; display: inline-block; margin-top: 15px; cursor: pointer; font-weight: 600; }
  .btn:hover { background: #4338ca; }
  .btn:disabled { background: #333; cursor: not-allowed; }
  .unlimited { color: #22c55e; font-weight: bold; font-size: 18px; }
  code { background: #222; padding: 4px 8px; border-radius: 4px; font-size: 14px; word-break: break-all; }
  pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; }
  footer { margin-top: 80px; padding: 30px 0; text-align: center; color: #555; border-top: 1px solid #222; }
  h1 { font-size: 48px; margin-bottom: 10px; }
  h2 { font-size: 32px; margin-top: 40px; }
  .legal { max-width: 800px; }
  .usage-bar { background: #222; border-radius: 8px; height: 8px; margin-top: 5px; }
  .usage-fill { background: #4f46e5; height: 8px; border-radius: 8px; }
  .locked { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
  <div class="container">
    <nav>
      <div>
        <a onclick="showPage('home')">Basin</a>
        <a onclick="showPage('docs')">Docs</a>
        <a onclick="requireLogin('dashboard')">Dashboard</a>
        <a onclick="showPage('terms')">Terms</a>
        <a onclick="showPage('privacy')">Privacy</a>
        <a onclick="showPage('refund')">Refund</a>
      </div>
      <div id="auth-btn"></div>
    </nav>

    <div id="app"></div>

    <footer>
      <p>© 2026 Basin Ledger API. support@basin.ai</p>
    </footer>
  </div>

<script>
let CURRENT_USER_ID = null;
let CLERK = null;
const app = document.getElementById('app');

const waitForClerk = () => new Promise(resolve => {
  if(window.Clerk) return resolve(window.Clerk);
  const interval = setInterval(() => {
    if(window.Clerk) { clearInterval(interval); resolve(window.Clerk); }
  }, 100);
});

async function apiFetch(url, options = {}) {
  const token = await CLERK.session.getToken();
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...options.headers
    }
  });
}

waitForClerk().then(async (Clerk) => {
  CLERK = Clerk;
  await Clerk.load();

  async function updateAuthUI() {
    const container = document.getElementById('auth-btn');
    if (Clerk.user) {
      CURRENT_USER_ID = Clerk.user.id;
      container.innerHTML = `<button class="btn" onclick="Clerk.signOut()">Logout</button>`;
      try { await apiFetch('/apikey', { method: 'POST' }); } catch(e) { console.log("Key creation skipped", e) }
    } else {
      CURRENT_USER_ID = null;
      container.innerHTML = `<button class="btn" onclick="Clerk.openSignIn()">Sign In</button>`;
    }
  }

  Clerk.addListener(({ user }) => updateAuthUI());
  await updateAuthUI();

  const initialPage = window.location.pathname.replace('/', '') || 'home';
  render(initialPage);
});

window.addEventListener('popstate', () => {
  const page = window.location.pathname.replace('/', '') || 'home';
  render(page);
});

function requireLogin(page) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  showPage(page);
}

function showPage(page) {
  window.history.pushState({}, '', '/' + page);
  render(page);
}

function render(page) {
  if(page === 'dashboard') renderDashboard();
  else if(page === 'docs') renderDocs();
  else if(page === 'terms') renderTerms();
  else if(page === 'privacy') renderPrivacy();
  else if(page === 'refund') renderRefund();
  else renderHome();
}

function renderHome() {
  app.innerHTML = `
  <div style="text-align: center; padding: 60px 0;">
    <h1>Immutable Ledger API</h1>
    <p style="font-size: 20px; color: #aaa;">Create tamper-proof logs, audit trails, and financial records in 200ms. Secure your database instantly.</p>
    <button onclick="showPage('docs')" class="btn">View Docs</button>
  </div>

  <h2 style="text-align: center;">Simple Pricing</h2>
  <div class="pricing">
    <div class="plan">
      <h3>Free</h3><p style="font-size: 28px; font-weight: bold;">$0</p>
      <p>1,000 Writes / 5,000 Verification Checks per month</p><p>10 req/min limit</p>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Monthly</h3><p style="font-size: 28px; font-weight: bold;">$28<span style="font-size: 16px; color: #aaa;">/mo</span></p>
      <p class="unlimited">UNLIMITED Writes & Verification</p><p>1,000 req/min limit</p>
      <button class="btn" onclick="handleUpgrade('monthly', this)">Upgrade Monthly</button>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Yearly</h3><p style="font-size: 28px; font-weight: bold;">$260<span style="font-size: 16px; color: #aaa;">/yr</span></p>
      <p class="unlimited">UNLIMITED Writes & Verification</p><p>1,000 req/min limit</p><p>Save 22%</p>
      <button class="btn" onclick="handleUpgrade('yearly', this)">Upgrade Yearly</button>
    </div>
  </div>
  ${!CURRENT_USER_ID? '<p style="text-align:center; margin-top:20px; color:#aaa;">Login to unlock Pro plans</p>' : ''}`;
}

async function handleUpgrade(plan, btn) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  
  const originalText = btn.innerText;
  btn.innerText = 'Creating Invoice...';
  btn.disabled = true;

  try {
    const res = await apiFetch('/create-payment', {
      method: 'POST',
      body: JSON.stringify({ plan: plan })
    });
    
    const data = await res.json();
    if(data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      alert('Error: ' + (data.error || 'Failed to create payment'));
      btn.innerText = originalText;
      btn.disabled = false;
    }
  } catch(e) {
    alert('Failed to create payment. Check console.');
    console.error(e);
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

async function createKey() {
  await apiFetch('/apikey', { method: 'POST' });
  renderDashboard();
}

async function renderDashboard() {
  if(!CURRENT_USER_ID) {
    app.innerHTML = `<div class="card"><h2>Login Required</h2><p>You must login to view your dashboard and API key.</p><button onclick="CLERK.openSignIn()" class="btn">Sign In</button></div>`;
    return;
  }

  app.innerHTML = `<h2>Dashboard</h2><div class="card" id="dashboard-card">Loading...</div>`;

  try {
    const res = await apiFetch('/usage');
    if(!res.ok) {
      const err = await res.json().catch(()=>({error:'Unknown error'}));
      return document.getElementById('dashboard-card').innerHTML = `Error: ${err.error}<br><button onclick="createKey()" class="btn">Create API Key</button>`;
    }
    const data = await res.json();

    const proveLimit = data.limits.prove === Infinity? 'Unlimited' : data.limits.prove.toLocaleString();
    const verifyLimit = data.limits.verify === Infinity? 'Unlimited' : data.limits.verify.toLocaleString();
    
    document.getElementById('dashboard-card').innerHTML = `
      <h3>Your API Key</h3>
      <p><code>${data.apiKey || 'No key generated'}</code></p>
      <h3>Usage Stats</h3>
      <p>Writes (Prove): ${data.usage.prove.toLocaleString()} / ${proveLimit}</p>
      <p>Verification: ${data.usage.verify.toLocaleString()} / ${verifyLimit}</p>
    `;
  } catch(e) {
    document.getElementById('dashboard-card').innerHTML = `Error loading dashboard details.`;
  }
}

function renderDocs() {
  app.innerHTML = `<div class="card"><h2>Documentation Redirect</h2><p>Please access documentation directly through the dedicated file route.</p><a href="/docs.html" class="btn">Go to Docs</a></div>`;
}

function renderTerms() {
  app.innerHTML = `<div class="card legal"><h2>Terms of Service</h2><p>Standard terms of usage apply.</p></div>`;
}

function renderPrivacy() {
  app.innerHTML = `<div class="card legal"><h2>Privacy Policy</h2><p>Data tracking records are localized and encrypted.</p></div>`;
}

function renderRefund() {
  app.innerHTML = `<div class="card legal"><h2>Refund Policy</h2><p>14-day standard subscription cancellation policies apply.</p></div>`;
}
</script>
</body>
</html>
