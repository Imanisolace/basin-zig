<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basin — Immutable Ledger API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c2F2aW5nLXNvbGUtOTguY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://saving-sole-98.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
<style>
  :root {
    --bg: #0d0e0f;
    --bg-raised: #17181a;
    --bg-inset: #0a0b0c;
    --text: #e8e6e1;
    --text-dim: #94897a;
    --border: #2e3032;
    --border-warm: #423c33;
    --clay: #a6947d;
    --clay-hover: #b7a48c;
    --gold: #c9a662;
    --gold-dim: rgba(201, 166, 98, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1000px; margin: 0 auto; padding: 20px; }

  nav {
    padding: 22px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  nav .brand {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
    color: var(--text);
    cursor: pointer;
  }
  nav .links a {
    color: var(--text-dim);
    margin-left: 22px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.15s ease;
  }
  nav .links a:hover { color: var(--text); }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
    max-width: 640px;
  }
  h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    margin-top: 56px;
    margin-bottom: 8px;
  }
  h3 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    margin: 0 0 10px;
  }

  .lede {
    font-size: 17px;
    color: var(--text-dim);
    max-width: 560px;
    margin: 0 0 32px;
  }

  .hero { padding: 48px 0 12px; }

  /* --- Proof tree: the signature element --- */
  .proof-tree {
    position: relative;
    width: 100%;
    max-width: 640px;
    height: 260px;
    margin: 0 auto 20px;
  }
  .tree-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tree-lines line {
    stroke: var(--border-warm);
    stroke-width: 1.5;
    vector-effect: non-scaling-stroke;
  }
  .tree-level { position: relative; }
  .tree-node {
    position: absolute;
    left: var(--x);
    top: var(--y);
    transform: translate(-50%, -50%);
    background: var(--bg-raised);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
    z-index: 1;
  }
  .tree-node .node-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    opacity: 0.65;
    margin-bottom: 2px;
  }
  .node-root {
    border-color: var(--gold);
    background: var(--gold-dim);
    color: var(--gold);
    font-size: 13px;
    padding: 10px 16px;
  }
  .node-root .node-label { color: var(--gold); opacity: 0.85; }

  .proof-caption {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 40px;
  }
  .proof-caption strong { color: var(--text); font-weight: 500; }

  @media (max-width: 640px) {
    .tree-lines { display: none; }
    .proof-tree {
      height: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tree-level {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      padding-bottom: 26px;
      width: 100%;
    }
    .tree-level:not(:last-child)::after {
      content: '↓';
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--border-warm);
      font-size: 14px;
    }
    .tree-node { position: static; transform: none; }
  }

  .card {
    background: var(--bg-raised);
    padding: 24px;
    border-radius: 6px;
    margin-top: 20px;
    border: 1px solid var(--border);
  }

  .pricing { display: flex; gap: 18px; margin-top: 24px; flex-wrap: wrap; }
  .plan {
    background: var(--bg-raised);
    padding: 24px;
    border-radius: 6px;
    flex: 1;
    border: 1px solid var(--border);
    min-width: 260px;
  }
  .plan.pro { border-color: var(--gold); background: var(--gold-dim); }
  .plan .price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 14px;
  }
  .plan .price span { font-size: 14px; font-weight: 400; color: var(--text-dim); }
  .plan p { font-size: 14px; color: var(--text-dim); margin: 4px 0; }
  .unlimited { color: var(--gold) !important; font-weight: 600; font-size: 15px !important; }
  .locked { opacity: 0.45; pointer-events: none; }

  .btn {
    background: var(--clay);
    color: #16140f;
    padding: 11px 20px;
    border: none;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    display: inline-block;
    margin-top: 14px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover { background: var(--clay-hover); }
  .btn:disabled { background: var(--border); color: var(--text-dim); cursor: not-allowed; }

  code {
    background: var(--bg-inset);
    border: 1px solid var(--border);
    padding: 3px 7px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    word-break: break-all;
    color: var(--text);
  }
  pre {
    background: var(--bg-inset);
    padding: 15px;
    border-radius: 6px;
    overflow-x: auto;
    border: 1px solid var(--border);
  }

  .legal { max-width: 700px; }
  .legal p { color: var(--text-dim); font-size: 15px; }

  footer {
    margin-top: 80px;
    padding: 30px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    border-top: 1px solid var(--border);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <nav>
      <div class="links" style="display:flex; align-items:center;">
        <a class="brand" onclick="showPage('home')" style="margin-left:0;">basin</a>
        <a onclick="showPage('docs')">Docs</a>
        <a onclick="requireLogin('dashboard')">Dashboard</a>
        <a onclick="showPage('terms')">Terms</a>
        <a onclick="showPage('privacy')">Privacy</a>
        <a onclick="showPage('refund')">Refund</a>
      </div>
      <div id="auth-btn"></div>
    </nav>

    <div id="app"></div>

    <footer>
      <p>© 2026 Basin Ledger API. support@basin.ai</p>
    </footer>
  </div>

<script>
let CURRENT_USER_ID = null;
let CLERK = null;
const app = document.getElementById('app');

const waitForClerk = () => new Promise(resolve => {
  if(window.Clerk) return resolve(window.Clerk);
  const interval = setInterval(() => {
    if(window.Clerk) { clearInterval(interval); resolve(window.Clerk); }
  }, 100);
});

async function apiFetch(url, options = {}) {
  const token = await CLERK.session.getToken();
  return fetch(url, {
    ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      ...options.headers
    }
  });
}

waitForClerk().then(async (Clerk) => {
  CLERK = Clerk;
  await Clerk.load();

  async function updateAuthUI() {
    const container = document.getElementById('auth-btn');
    if (Clerk.user) {
      CURRENT_USER_ID = Clerk.user.id;
      container.innerHTML = `<button class="btn" onclick="Clerk.signOut()">Logout</button>`;
      try { await apiFetch('/apikey', { method: 'POST' }); } catch(e) { console.log("Key creation skipped", e) }
    } else {
      CURRENT_USER_ID = null;
      container.innerHTML = `<button class="btn" onclick="Clerk.openSignIn()">Sign In</button>`;
    }
  }

  Clerk.addListener(({ user }) => updateAuthUI());
  await updateAuthUI();

  const initialPage = window.location.pathname.replace('/', '') || 'home';
  render(initialPage);
});

window.addEventListener('popstate', () => {
  const page = window.location.pathname.replace('/', '') || 'home';
  render(page);
});

function requireLogin(page) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  showPage(page);
}

function showPage(page) {
  window.history.pushState({}, '', '/' + page);
  render(page);
}

function render(page) {
  if(page === 'dashboard') renderDashboard();
  else if(page === 'docs') renderDocs();
  else if(page === 'terms') renderTerms();
  else if(page === 'privacy') renderPrivacy();
  else if(page === 'refund') renderRefund();
  else renderHome();
}

function renderHome() {
  app.innerHTML = `
  <div class="hero">
    <div class="eyebrow">HOW IT WORKS</div>
    <h1>One root hash. Proof for every leaf beneath it.</h1>
    <p class="lede">Basin builds a Merkle tree over your records and gives you a proof anyone can check — without trusting you, and without seeing the rest of your data.</p>
  </div>

  <div class="proof-tree">
    <svg class="tree-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <line x1="50" y1="15" x2="25" y2="50"></line>
      <line x1="50" y1="15" x2="75" y2="50"></line>
      <line x1="25" y1="50" x2="12.5" y2="85"></line>
      <line x1="25" y1="50" x2="37.5" y2="85"></line>
      <line x1="75" y1="50" x2="62.5" y2="85"></line>
      <line x1="75" y1="50" x2="87.5" y2="85"></line>
    </svg>
    <div class="tree-level">
      <div class="tree-node node-root" style="--x:50%; --y:15%;">
        <span class="node-label">root</span><span>a3f9…c17e</span>
      </div>
    </div>
    <div class="tree-level">
      <div class="tree-node" style="--x:25%; --y:50%;"><span>8e12…4d0b</span></div>
      <div class="tree-node" style="--x:75%; --y:50%;"><span>c701…9fa3</span></div>
    </div>
    <div class="tree-level">
      <div class="tree-node" style="--x:12.5%; --y:85%;"><span class="node-label">leaf</span><span>4d2a…1e8c</span></div>
      <div class="tree-node" style="--x:37.5%; --y:85%;"><span class="node-label">leaf</span><span>9b6f…c320</span></div>
      <div class="tree-node" style="--x:62.5%; --y:85%;"><span class="node-label">leaf</span><span>1a7e…d945</span></div>
      <div class="tree-node" style="--x:87.5%; --y:85%;"><span class="node-label">leaf</span><span>e830…2b71</span></div>
    </div>
  </div>
  <p class="proof-caption">Change any leaf, and <strong>root</strong> changes. That's the whole proof.</p>

  <h2>Free to test. One price for everything else.</h2>
  <div class="pricing">
    <div class="plan">
      <h3>Free</h3><p class="price">$0</p>
      <p>1,000 writes / 5,000 verifications per month</p><p>10 req/min limit</p>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Monthly</h3><p class="price">$28<span>/mo</span></p>
      <p class="unlimited">Unlimited writes &amp; verification</p><p>1,000 req/min limit</p>
      <button class="btn" onclick="handleUpgrade('monthly', this)">Upgrade Monthly</button>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Yearly</h3><p class="price">$260<span>/yr</span></p>
      <p class="unlimited">Unlimited writes &amp; verification</p><p>1,000 req/min limit</p><p>Save 22%</p>
      <button class="btn" onclick="handleUpgrade('yearly', this)">Upgrade Yearly</button>
    </div>
  </div>
  ${!CURRENT_USER_ID? '<p style="text-align:center; margin-top:20px; color:var(--text-dim); font-size:14px;">Sign in to unlock Pro plans</p>' : ''}`;
}

async function handleUpgrade(plan, btn) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  
  const originalText = btn.innerText;
  btn.innerText = 'Creating Invoice...';
  btn.disabled = true;

  try {
    const res = await apiFetch('/create-payment', {
      method: 'POST',
      body: JSON.stringify({ plan: plan })
    });
    
    const data = await res.json();
    if(data.payment_url) {
      window.location.href = data.payment_url;
    } else {
      alert('Error: ' + (data.error || 'Failed to create payment'));
      btn.innerText = originalText;
      btn.disabled = false;
    }
  } catch(e) {
    alert('Failed to create payment. Check console.');
    console.error(e);
    btn.innerText = originalText;
    btn.disabled = false;
  }
}

async function createKey() {
  await apiFetch('/apikey', { method: 'POST' });
  renderDashboard();
}

async function renderDashboard() {
  if(!CURRENT_USER_ID) {
    app.innerHTML = `<div class="card"><h2 style="margin-top:0;">Sign in required</h2><p style="color:var(--text-dim);">Sign in to view your dashboard and API key.</p><button onclick="CLERK.openSignIn()" class="btn">Sign In</button></div>`;
    return;
  }

  app.innerHTML = `<h2>Dashboard</h2><div class="card" id="dashboard-card">Loading...</div>`;

  try {
    const res = await apiFetch('/usage');
    if(!res.ok) {
      const err = await res.json().catch(()=>({error:'Unknown error'}));
      return document.getElementById('dashboard-card').innerHTML = `Error: ${err.error}<br><button onclick="createKey()" class="btn">Create API Key</button>`;
    }
    const data = await res.json();

    const proveLimit = data.limits.prove === Infinity? 'Unlimited' : data.limits.prove.toLocaleString();
    const verifyLimit = data.limits.verify === Infinity? 'Unlimited' : data.limits.verify.toLocaleString();
    
    document.getElementById('dashboard-card').innerHTML = `
      <h3>Your API key</h3>
      <p><code>${data.apiKey || 'No key generated'}</code></p>
      <h3 style="margin-top:22px;">Usage this month</h3>
      <p style="color:var(--text-dim); font-size:14px;">Writes (prove): ${data.usage.prove.toLocaleString()} / ${proveLimit}</p>
      <p style="color:var(--text-dim); font-size:14px;">Verification: ${data.usage.verify.toLocaleString()} / ${verifyLimit}</p>
    `;
  } catch(e) {
    document.getElementById('dashboard-card').innerHTML = `Error loading dashboard details.`;
  }
}

function renderDocs() {
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;">Documentation</h2><p style="color:var(--text-dim);">Full endpoint reference lives on its own page.</p><a href="/docs.html" class="btn">Go to Docs</a></div>`;
}

function renderTerms() {
  app.innerHTML = `<div class="card legal"><h2 style="margin-top:0;">Terms of Service</h2><p>Standard terms of usage apply.</p></div>`;
}

function renderPrivacy() {
  app.innerHTML = `<div class="card legal"><h2 style="margin-top:0;">Privacy Policy</h2><p>Data tracking records are localized and encrypted.</p></div>`;
}

function renderRefund() {
  app.innerHTML = `<div class="card legal"><h2 style="margin-top:0;">Refund Policy</h2><p>14-day standard subscription cancellation policies apply.</p></div>`;
}
</script>
</body>
</html>
