<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basin - ZK Proof API</title>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_c2F2aW5nLXNvbGUtOTguY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://pk-test-c2f2aW5nLXNvbGUtOTguY2xlcmsuYWNjb3VudHMuZGV2JA.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0a0a0a; color: #ddd; margin: 0; padding: 0; line-height: 1.6; }
.container { max-width: 1000px; margin: 0 auto; padding: 20px; }
  nav { padding: 20px 0; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
  nav a { color: #888; margin: 0 15px; text-decoration: none; font-weight: 500; cursor: pointer; }
  nav a:hover { color: #fff; }
.card { background: #111; padding: 25px; border-radius: 12px; margin-top: 20px; border: 1px solid #222; }
.pricing { display: flex; gap: 20px; margin-top: 30px; flex-wrap: wrap; }
.plan { background: #111; padding: 25px; border-radius: 12px; flex: 1; border: 1px solid #333; min-width: 280px; }
.plan.pro { border: 2px solid #4f46e5; background: #0f0f1a; }
.btn { background: #4f46e5; color: #fff; padding: 12px 24px; border: none; border-radius: 8px; text-decoration: none; display: inline-block; margin-top: 15px; cursor: pointer; font-weight: 600; }
.btn:hover { background: #4338ca; }
.unlimited { color: #22c55e; font-weight: bold; font-size: 18px; }
  code { background: #222; padding: 4px 8px; border-radius: 4px; font-size: 14px; word-break: break-all; }
  pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #333; }
  footer { margin-top: 80px; padding: 30px 0; text-align: center; color: #555; border-top: 1px solid #222; }
  h1 { font-size: 48px; margin-bottom: 10px; }
  h2 { font-size: 32px; margin-top: 40px; }
.legal { max-width: 800px; }
.usage-bar { background: #222; border-radius: 8px; height: 8px; margin-top: 5px; }
.usage-fill { background: #4f46e5; height: 8px; border-radius: 8px; }
.locked { opacity: 0.5; pointer-events: none; }
</style>
</head>
<body>
  <div class="container">
    <nav>
      <div>
        <a onclick="showPage('home')">Basin</a>
        <a onclick="showPage('docs')">Docs</a>
        <a onclick="requireLogin('dashboard')">Dashboard</a>
        <a onclick="showPage('terms')">Terms</a>
        <a onclick="showPage('privacy')">Privacy</a>
        <a onclick="showPage('refund')">Refund</a>
      </div>
      <div id="auth-btn"></div>
    </nav>

    <div id="app"></div>

    <footer>
      <p>© 2026 Basin ZK API. support@basin.ai</p>
    </footer>
  </div>

<script>
let CURRENT_USER_ID = null;
let CLERK = null;
const app = document.getElementById('app');

const waitForClerk = () => new Promise(resolve => {
  if(window.Clerk) return resolve(window.Clerk);
  const interval = setInterval(() => {
    if(window.Clerk) { clearInterval(interval); resolve(window.Clerk); }
  }, 100);
});

async function apiFetch(url, options = {}) {
  const token = await CLERK.session.getToken();
  return fetch(url, {
   ...options,
    headers: {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
     ...options.headers
    }
  });
}

waitForClerk().then(async (Clerk) => {
  CLERK = Clerk;
  await Clerk.load();

  async function updateAuthUI() {
    const container = document.getElementById('auth-btn');
    if (Clerk.user) {
      CURRENT_USER_ID = Clerk.user.id;
      container.innerHTML = `<button class="btn" onclick="Clerk.signOut()">Logout</button>`;
      await apiFetch('/apikey', { method: 'POST' }); // Send token now
    } else {
      CURRENT_USER_ID = null;
      container.innerHTML = `<button class="btn" onclick="Clerk.openSignIn()">Sign In</button>`;
    }
  }

  Clerk.addListener(({ user }) => updateAuthUI());
  await updateAuthUI();

  const initialPage = window.location.pathname.replace('/', '') || 'home';
  render(initialPage);
});

window.addEventListener('popstate', () => {
  const page = window.location.pathname.replace('/', '') || 'home';
  render(page);
});

function requireLogin(page) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  showPage(page);
}

function showPage(page) {
  window.history.pushState({}, '', '/' + page);
  render(page);
}

function render(page) {
  if(page === 'dashboard') renderDashboard();
  else if(page === 'docs') renderDocs();
  else if(page === 'terms') renderTerms();
  else if(page === 'privacy') renderPrivacy();
  else if(page === 'refund') renderRefund();
  else renderHome();
}

function renderHome() {
  const monthlyLink = CURRENT_USER_ID? `https://nowpayments.io/payment/?iid=4900460102&order_id=${CURRENT_USER_ID}` : '#';
  const yearlyLink = CURRENT_USER_ID? `https://nowpayments.io/payment/?iid=4328033905&order_id=${CURRENT_USER_ID}` : '#';

  app.innerHTML = `
  <div style="text-align: center; padding: 60px 0;">
    <h1>ZK Proof API</h1>
    <p style="font-size: 20px; color: #aaa;">Generate and verify Merkle proofs in 200ms. No infra needed.</p>
    <button onclick="showPage('docs')" class="btn">View Docs</button>
  </div>

  <h2 style="text-align: center;">Simple Pricing</h2>
  <div class="pricing">
    <div class="plan">
      <h3>Free</h3><p style="font-size: 28px; font-weight: bold;">$0</p>
      <p>1000 Prove / 5000 Verify per month</p><p>10 req/min</p>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Monthly</h3><p style="font-size: 28px; font-weight: bold;">$28<span style="font-size: 16px; color: #aaa;">/mo</span></p>
      <p class="unlimited">UNLIMITED Prove & Verify</p><p>1000 req/min</p>
      <button class="btn" onclick="handleUpgrade('${monthlyLink}')">Upgrade Monthly</button>
    </div>
    <div class="plan pro ${!CURRENT_USER_ID? 'locked' : ''}">
      <h3>Pro Yearly</h3><p style="font-size: 28px; font-weight: bold;">$260<span style="font-size: 16px; color: #aaa;">/yr</span></p>
      <p class="unlimited">UNLIMITED Prove & Verify</p><p>1000 req/min</p><p>Save 22%</p>
      <button class="btn" onclick="handleUpgrade('${yearlyLink}')">Upgrade Yearly</button>
    </div>
  </div>
  ${!CURRENT_USER_ID? '<p style="text-align:center; margin-top:20px; color:#aaa;">Login to unlock Pro plans</p>' : ''}`;
}

function handleUpgrade(link) {
  if(!CURRENT_USER_ID) {
    CLERK.openSignIn();
    return;
  }
  window.location.href = link;
}

async function createKey() {
  await apiFetch('/apikey', { method: 'POST' });
  location.reload();
}

async function renderDashboard() {
  if(!CURRENT_USER_ID) {
    app.innerHTML = `<div class="card"><h2>Login Required</h2><p>You must login to view your dashboard and API key.</p><button onclick="CLERK.openSignIn()" class="btn">Sign In</button></div>`;
    return;
  }

  app.innerHTML = `<h2>Dashboard</h2><div class="card" id="dashboard-card">Loading...</div>`;

  try {
    const res = await apiFetch('/usage'); // Send token now
    if(!res.ok) {
      const err = await res.json().catch(()=>({error:'Unknown error'}));
      return document.getElementById('dashboard-card').innerHTML = `Error: ${err.error}<br><button onclick="createKey()" class="btn">Create API Key</button>`;
    }
    const data = await res.json();

    const proveLimit = data.limits.prove === Infinity? 'Unlimited' : data.limits.prove.toLocaleString();
    const verifyLimit = data.limits.verify === Infinity? 'Unlimited' : data.limits.verify.toLocaleString();
    const provePercent = data.limits.prove === Infinity? 0 : (data.usage.prove / data.limits.prove) * 100;
    const verifyPercent = data.limits.verify === Infinity? 0 : (data.usage.verify / data.limits.verify) * 100;

    document.getElementById('dashboard-card').innerHTML = `
      <h3>Account Overview</h3>
      <p><b>Email:</b> ${data.email}</p>
      <p><b>Plan:</b> <span style="text-transform: capitalize;">${data.tier}</span> ${data.billing? `(${data.billing})` : ''}</p>
      <p><b>API Key:</b> <code id="key">${data.apiKey}</code>
      <button class="btn" style="padding: 6px 12px; font-size: 12px; margin-left: 10px;" onclick="navigator.clipboard.writeText(document.getElementById('key').innerText)">Copy</button></p>
      <hr style="border-color: #333; margin: 20px 0;">
      <p><b>Prove Usage:</b> ${data.usage.prove.toLocaleString()} / ${proveLimit}</p>
      ${data.limits.prove!== Infinity? `<div class="usage-bar"><div class="usage-fill" style="width: ${provePercent}%"></div></div>` : ''}
      <p style="margin-top: 15px;"><b>Verify Usage:</b> ${data.usage.verify.toLocaleString()} / ${verifyLimit}</p>
      ${data.limits.verify!== Infinity? `<div class="usage-bar"><div class="usage-fill" style="width: ${verifyPercent}%"></div></div>` : ''}
      <p style="margin-top: 15px;"><b>Expires:</b> ${data.expires_at? new Date(data.expires_at).toLocaleDateString() : 'Never'}</p>
      ${data.tier === 'free'? '<button onclick="showPage(\'home\')" class="btn" style="margin-top: 20px;">Upgrade to Pro</button>' : '<p style="color: #22c55e; margin-top: 20px;">✅ You are on Pro</p>'}
    `;
  } catch(e) {
    document.getElementById('dashboard-card').innerText = 'Failed to load. Check Railway logs.'
  }
}

function renderDocs() {
  if(!CURRENT_USER_ID) {
    app.innerHTML = `<div class="card"><h2>Login Required</h2><p>You must login to view API docs and get your API key.</p><button onclick="CLERK.openSignIn()" class="btn">Sign In</button></div>`;
    return;
  }
  app.innerHTML = `
  <h2>API Documentation</h2>
  <p>Base URL: <code>https://basin-zig-production.up.railway.app</code></p>
  <p>Auth: Use <code>x-api-key: zk_...</code> from Dashboard</p>
  
  <div class="card">
    <h3>POST /prove</h3>
    <p>Generate a Merkle proof for an item</p>
    <pre>curl -X POST https://basin-zig-production.up.railway.app/prove \\
-H "x-api-key: zk_..." \\
-H "Content-Type: application/json" \\
-d '{"item": "alice"}'</pre>
    <p><b>Response:</b> { root, proof, target_index, valid }</p>
  </div>

  <div class="card">
    <h3>POST /verify</h3>
    <p>Verify a Merkle proof</p>
    <pre>curl -X POST https://basin-zig-production.up.railway.app/verify \\
-H "x-api-key: zk_..." \\
-H "Content-Type: application/json" \\
-d '{"root": "...", "item": "alice", "target_index": 0, "proof": [...]}'</pre>
    <p><b>Response:</b> { valid: true/false }</p>
  </div>

  <div class="card">
    <h3>GET /usage</h3>
    <p>Get your current usage and limits</p>
    <pre>curl https://basin-zig-production.up.railway.app/usage -H "x-api-key: zk_..."</pre>
  </div>
  `;
}

function renderTerms() { 
  app.innerHTML = `<div class="legal"><h2>Terms of Service</h2><p>Last Updated: August 9, 2026</p><p>By using Basin ZK API, you agree to these terms. API is provided "as is". We are not liable for downtime.</p></div>`; 
}

function renderPrivacy() { 
  app.innerHTML = `<div class="legal"><h2>Privacy Policy</h2><p>Last Updated: August 9, 2026</p><p>We store your email, API key, and usage data. We do not sell your data. Data is stored on Railway Postgres.</p></div>`; 
}

function renderRefund() { 
  app.innerHTML = `<div class="legal"><h2>Refund Policy</h2><p>Last Updated: August 9, 2026</p><p>All sales are final. Crypto payments via NowPayments cannot be refunded. If service is down for 7+ days, contact support@basin.ai</p></div>`; 
}
</script>
</body>
</html>
