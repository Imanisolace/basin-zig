<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basin - ZK Proof API</title>
<style>
  body { font-family: Arial, sans-serif; background: #0a0a0a; color: #fff; margin: 0; padding: 20px; }
  nav a { color: #888; margin: 0 10px; text-decoration: none; }
  nav a:hover { color: #fff; }
 .card { background: #111; padding: 20px; border-radius: 8px; margin-top: 20px; }
 .pricing { display: flex; gap: 20px; margin-top: 20px; }
 .plan { background: #1a1a1a; padding: 20px; border-radius: 8px; flex: 1; border: 1px solid #333; }
 .plan.pro { border: 2px solid #4f46e5; }
 .btn { background: #4f46e5; color: #fff; padding: 10px 20px; border: none; border-radius: 5px; text-decoration: none; display: inline-block; margin-top: 10px; }
 .btn:hover { background: #4338ca; }
 .unlimited { color: #22c55e; font-weight: bold; }
</style>
</head>
<body>
  <h1>Basin</h1>
  <nav>
    <a href="/">Home</a> |
    <a href="/dashboard">Dashboard</a> |
    <a href="/terms">Terms</a> |
    <a href="/privacy">Privacy</a> |
    <a href="/refund">Refund</a>
  </nav>
  <hr>

  <div id="app"></div>

<script>
const path = window.location.pathname;
const app = document.getElementById('app');

if(path === '/dashboard') {
  app.innerHTML = `
  <h2>Dashboard</h2>
  <div class="card" id="dashboard-card">Loading...</div>
  `;
  loadDashboard();
} else {
  app.innerHTML = `
  <h2>ZK Proof API for Developers</h2>
  <p>Generate and verify Merkle proofs with 1 API call. No infra needed.</p>
  
  <h2>Pricing</h2>
  <div class="pricing">
    <div class="plan">
      <h3>Free</h3>
      <p>$0 / month</p>
      <p>1000 Prove / 5000 Verify</p>
      <p>10 req/min</p>
    </div>
    <div class="plan pro">
      <h3>Pro Monthly</h3>
      <p>$28 / month</p>
      <p class="unlimited">UNLIMITED Prove & Verify</p>
      <p>1000 req/min</p>
      <a href="https://nowpayments.io/payment/link/4900460102" class="btn">Upgrade Monthly</a>
    </div>
    <div class="plan pro">
      <h3>Pro Yearly</h3>
      <p>$260 / year</p>
      <p class="unlimited">UNLIMITED Prove & Verify</p>
      <p>1000 req/min</p>
      <p>Save 22%</p>
      <a href="https://nowpayments.io/payment/link/4328033905" class="btn">Upgrade Yearly</a>
    </div>
  </div>
  `;
}

async function loadDashboard() {
  const apiKey = localStorage.getItem('apiKey'); // Or get from Clerk
  if(!apiKey) return document.getElementById('dashboard-card').innerText = 'Please login';
  
  const res = await fetch('/usage', { headers: { 'x-api-key': apiKey } });
  const data = await res.json();
  
  const proveLimit = data.limits.prove === Infinity? 'Unlimited' : data.limits.prove;
  const verifyLimit = data.limits.verify === Infinity? 'Unlimited' : data.limits.verify;
  
  document.getElementById('dashboard-card').innerHTML = `
    <h3>Welcome, ${data.email || 'User'}</h3>
    <p><b>Plan:</b> ${data.tier} (${data.billing || 'none'})</p>
    <p><b>API Key:</b> <code>${apiKey}</code></p>
    <p><b>Prove:</b> ${data.usage.prove} / ${proveLimit}</p>
    <p><b>Verify:</b> ${data.usage.verify} / ${verifyLimit}</p>
    <p><b>Rate Limit:</b> ${data.rate_limit.max} req/min</p>
    <p><b>Expires:</b> ${data.expires_at? new Date(data.expires_at).toLocaleDateString() : 'Never'}</p>
  `;
}
</script>
</body>
</html>
