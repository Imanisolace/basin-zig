<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basin - AI Backend API</title>
  <!-- THIS IS THE OFFICIAL CLERK CDN -->
  <script 
    async 
    crossorigin="anonymous" 
    data-clerk-publishable-key="pk_test_c2F2aW5nLXNvbGUtOTguY2xlcmsuYWNjb3VudHMuZGV2JA" 
    src="https://saving-sole-98.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
    type="text/javascript">
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 1000px; margin: 50px auto; padding: 20px; line-height: 1.6; color: #111; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    nav a { margin-right: 15px; text-decoration: none; color: #111; }
    footer { margin-top: 100px; border-top: 1px solid #eee; padding-top: 20px; font-size: 14px; color: #666; }
   .page { display: none; }
   .page.active { display: block; }
   .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
   .plan { border: 1px solid #ddd; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; }
   .plan.highlight { border: 2px solid #111; }
   .price { font-size: 32px; font-weight: bold; }
   .badge { background: #10b981; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
   .btn { background: #111; color: white; padding: 12px 18px; border-radius: 6px; text-align: center; margin-top: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 16px; }
   .btn:disabled { background: #ccc; cursor: not-allowed; }
   .dashboard-box { background: #f8f8f8; padding: 20px; border-radius: 8px; margin-top: 20px; border: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>Basin</h1>
  <nav>
    <div>
      <a href="/">Home</a> | 
      <a href="/dashboard">Dashboard</a> | 
      <a href="/terms">Terms</a> | 
      <a href="/privacy">Privacy</a> | 
      <a href="/refund">Refund</a>
    </div>
    <div id="user-button"></div>
  </nav>
  <hr>

  <div id="home" class="page">
    <h2>AI Backend API for Developers</h2>
    <h3>Pricing</h3>
    <div class="pricing-grid">
      <div class="plan"><h3>Free</h3><p class="price">$0</p><p>1,000 prove / month</p></div>
      <div class="plan highlight">
        <h3>Pro</h3>
        <p class="price">$28/mo</p>
        <p>or <b>$260/yr</b> <span class="badge">Save 23%</span></p>
        <p><b>Unlimited</b> prove</p>
        <button id="btn-monthly" class="btn">Buy Monthly $28</button>
        <button id="btn-yearly" class="btn">Buy Annual $260</button>
        <p id="login-msg">Login to purchase</p>
      </div>
    </div>
  </div>

  <div id="dashboard" class="page"><h2>Dashboard</h2><div id="dashboard-content"><p>Loading...</p></div></div>
  <div id="terms" class="page"><h2>Terms</h2></div>
  <div id="privacy" class="page"><h2>Privacy</h2></div>
  <div id="refund" class="page"><h2>Refund</h2></div>

  <footer>Contact: support@basin.ai | © 2026 Basin</footer>

  <script>
    function initClerk() {
      if (!window.Clerk) {
        console.log("Waiting for Clerk...");
        setTimeout(initClerk, 200);
        return;
      }

      Clerk.load().then(() => {
        console.log("Clerk loaded!", Clerk.user);

        function updateUI() {
          const userBtnDiv = document.getElementById('user-button');
          const btnMonthly = document.getElementById('btn-monthly');
          const btnYearly = document.getElementById('btn-yearly');
          const loginMsg = document.getElementById('login-msg');

          if (Clerk.user) {
            userBtnDiv.innerHTML = '<div id="clerk-user-button"></div>';
            Clerk.mountUserButton(document.getElementById('clerk-user-button'));
            if(btnMonthly) btnMonthly.disabled = false;
            if(btnYearly) btnYearly.disabled = false;
            if(loginMsg) loginMsg.style.display = 'none';
          } else {
            userBtnDiv.innerHTML = '<button class="btn" id="login-btn">Login</button>';
            document.getElementById('login-btn').onclick = () => {
              console.log("Opening signin...");
              Clerk.openSignIn();
            };
            if(btnMonthly) btnMonthly.disabled = true;
            if(btnYearly) btnYearly.disabled = true;
            if(loginMsg) loginMsg.style.display = 'block';
          }
        }

        updateUI();
        Clerk.addListener(updateUI);

        const page = window.location.pathname.substring(1) || 'home';
        const el = document.getElementById(page);
        if(el) el.classList.add('active');

        if(page === 'dashboard') {
          const dashContent = document.getElementById('dashboard-content');
          if(!Clerk.user) {
            dashContent.innerHTML = '<p>Please <button class="btn" id="login-btn-dash">Login</button></p>';
            document.getElementById('login-btn-dash').onclick = () => Clerk.openSignIn();
          } else {
            const email = Clerk.user.primaryEmailAddress.emailAddress;
            dashContent.innerHTML = `<div class="dashboard-box"><h3>Welcome, ${email}</h3><p><b>Plan:</b> Free</p></div>`;
          }
        }

        function goToPayment(plan) {
          if(!Clerk.user) { Clerk.openSignIn(); return; }
          const email = Clerk.user.primaryEmailAddress.emailAddress;
          const iid = plan === 'monthly' ? '4900460102' : '4328033905';
          window.location.href = `https://nowpayments.io/payment/?iid=${iid}&order_description=${encodeURIComponent(email)}`;
        }
        const btnM = document.getElementById('btn-monthly');
        const btnY = document.getElementById('btn-yearly');
        if(btnM) btnM.onclick = () => goToPayment('monthly');
        if(btnY) btnY.onclick = () => goToPayment('yearly');
      });
    }
    initClerk();
  </script>
</body>
</html>
