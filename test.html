<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basin ZK - Test Checkout</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; background: #fafafa; }
    input, button, a.button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ddd; font-size: 16px; text-decoration: none; display: block; text-align: center; }
    button { background: #5f36ff; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #4a2ad4; }
    a.button { background: #10b981; color: white; border: none; cursor: pointer; font-weight: 600; }
    a.button:hover { background: #059669; }
    .card { border: 1px solid #ddd; padding: 20px; margin: 15px 0; border-radius: 8px; background: white; }
    #debug { background: #1e1e1e; color: #00ff00; padding: 15px; margin-top: 20px; font-family: monospace; font-size: 12px; white-space: pre-wrap; border-radius: 6px; min-height: 100px; }
    h1 { color: #5f36ff; }
  </style>
</head>
<body>
  <h1>Basin ZK - Paddle Sandbox Test</h1>
  <p>Clicking will create a checkout session and redirect you</p>

  <label><b>User ID</b></label>
  <input id="userId" value="test_user_123" />

  <label><b>Email</b></label>
  <input id="email" value="test@test.com" type="email" />

  <div class="card">
    <h3>Pro Yearly - $90/year</h3>
    <p>Price ID: pri_01kyw5pdehq2ef6n88700pgksd</p>
    <a class="button" onclick="createCheckout('pri_01kyw5pdehq2ef6n88700pgksd')">Buy Yearly</a>
  </div>

  <div class="card">
    <h3>Pro Monthly - $9/month</h3>
    <p>Price ID: pri_01kyvnr0j567m2ns57cy0x58vw</p>
    <a class="button" onclick="createCheckout('pri_01kyvnr0j567m2ns57cy0x58vw')">Buy Monthly</a>
  </div>

  <hr>
  <button onclick="getApiKey()">Get API Key from Backend</button>
  <button onclick="prove()">Prove 'alice'</button>

  <h4>Debug Log:</h4>
  <div id="debug">Waiting for action...</div>

  <script>
    const API_URL = 'https://basin-zig-production.up.railway.app';
    const RETURN_URL = window.location.href; // where paddle sends user back after payment

    function log(msg) {
      const el = document.getElementById('debug');
      el.innerText += '\n' + new Date().toLocaleTimeString() + ': ' + msg;
      el.scrollTop = el.scrollHeight;
    }

    // NEW: Create checkout session via backend
    async function createCheckout(priceId) {
      log('Creating checkout session for: ' + priceId);
      try {
        const res = await fetch(API_URL + '/create-checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            priceId: priceId,
            email: document.getElementById('email').value,
            user_id: document.getElementById('userId').value,
            return_url: RETURN_URL + '?success=true'
          })
        });
        const data = await res.json();
        log('Got URL: ' + data.url);
        if(data.url) {
          window.open(data.url, '_blank'); // opens paddle
        } else {
          log('Error: ' + JSON.stringify(data));
        }
      } catch(e) { log('Error: ' + e) }
    }

    // YOUR EXISTING BACKEND CALLS - KEPT
    async function getApiKey() {
      log('Calling /apikey...');
      try {
        const res = await fetch(API_URL + '/apikey', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: document.getElementById('userId').value,
            email: document.getElementById('email').value
          })
        });
        const data = await res.json();
        log('API Response: ' + JSON.stringify(data, null, 2));
      } catch(e) { log('Error: ' + e) }
    }

    async function prove() {
      log('Calling /prove...');
      try {
        const res = await fetch(API_URL + '/prove', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: document.getElementById('userId').value,
            email: document.getElementById('email').value
          })
        });
        const data = await res.json();
        log('Prove Response: ' + JSON.stringify(data, null, 2));
      } catch(e) { log('Error: ' + e) }
    }

    // Check if we came back from payment
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('success')) {
      log('SUCCESS: Payment completed!');
    }
  </script>
</body>
</html>
