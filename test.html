<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BasinZig Paddle Test</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; } 
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; }
    button { background: #0ea5e9; border: none; font-weight: bold; cursor: pointer; } 
   .tier button { background: #22c55e; }
    #output { background: #020617; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>BasinZig Paddle Sandbox Test</h1>
  
  <input id="userId" placeholder="user_id: test123" />
  <input id="email" type="email" placeholder="email: test@test.com" />
  <button onclick="getKey()">1. Get API Key</button>
  <input id="apiKey" readonly />

  <h2>2. Upgrade</h2>
  <div class="tier">
    <button onclick="checkout('pri_01kyvnr0j567m2ns57cy0x58vw')">Pro Monthly $9</button>
  </div>

  <div id="output"></div>

  <script>
    const API_URL = 'https://basin-zig-production.up.railway.app';
    
    // THIS IS THE MAGIC LINE
    Paddle.Environment.set('sandbox');
    Paddle.Initialize({ 
      token: 'test_06a88ff0ae7e935e5566c4c3d36'
    });

    function log(data) { document.getElementById('output').innerText = JSON.stringify(data, null, 2); }
    
    async function getKey() {
      const res = await fetch(`${API_URL}/apikey`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email: email.value, user_id: userId.value }) });
      const data = await res.json(); 
      apiKey.value = data.apiKey; 
      log(data);
    }

    function checkout(priceId) {
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customer: { email: email.value },
        customData: { user_id: userId.value },
        settings: { displayMode: 'overlay' }
      });
    }
  </script>
</body>
</html>
