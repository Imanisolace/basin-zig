<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basin ZK - Test Checkout</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 40px auto; padding: 20px; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background: #5f36ff; color: white; border: none; cursor: pointer; border-radius: 6px; }
    button:hover { background: #4a2ad4; }
    .card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; }
    #debug { background: #f5f5f5; padding: 10px; margin-top: 20px; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Basin ZK - Paddle Sandbox Test</h1>
  
  <label>User ID</label>
  <input id="userId" value="test_user_123" />
  
  <label>Email</label>
  <input id="email" value="test@test.com" />

  <div class="card">
    <h3>Pro Yearly - $90/year</h3>
    <button onclick="checkout('pri_01kyw5pdehq2ef6n88700pgksd')">Buy Yearly</button>
  </div>

  <div class="card">
    <h3>Pro Monthly - $9/month</h3>
    <button onclick="checkout('pri_01kyvnr0j567m2ns57cy0x58vw')">Buy Monthly</button>
  </div>

  <button onclick="getApiKey()">Get API Key</button>
  <button onclick="prove()">Prove 'alice'</button>

  <div id="debug"></div>

  <script>
    // 1. INIT PADDLE SANDBOX
    Paddle.Initialize({
      token: 'test_06a88ff0ae7e935e5566c4c3d36'
    });

    const API_URL = 'https://basin-zig-production.up.railway.app';

    function log(msg) {
      document.getElementById('debug').innerText += msg + '\n';
    }

    // 2. CHECKOUT FUNCTION
    function checkout(priceId) {
      log('Opening checkout for: ' + priceId);
      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customer: { email: document.getElementById('email').value },
        customData: { user_id: document.getElementById('userId').value },
        settings: { 
          displayMode: 'overlay',
          theme: 'light'
        }
      });
    }

    // 3. YOUR BACKEND CALLS
    async function getApiKey() {
      log('Calling /apikey...');
      const res = await fetch(API_URL + '/apikey', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: document.getElementById('userId').value,
          email: document.getElementById('email').value
        })
      });
      const data = await res.json();
      log('API Response: ' + JSON.stringify(data, null, 2));
    }

    async function prove() {
      log('Calling /prove...');
      const res = await fetch(API_URL + '/prove', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: document.getElementById('userId').value,
          email: document.getElementById('email').value
        })
      });
      const data = await res.json();
      log('Prove Response: ' + JSON.stringify(data, null, 2));
    }
  </script>
</body>
</html>
