<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BasinZig Paddle Test</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #0f172a; color: #e2e8f0; }
    h1 { color: #38bdf8; text-align: center; } 
    input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 16px; }
    button { background: #0ea5e9; border: none; font-weight: bold; cursor: pointer; } 
   .tier button { background: #22c55e; margin: 5px 0;}
    #output { background: #020617; padding: 15px; border-radius: 8px; white-space: pre-wrap; font-size: 12px; margin-top: 20px; border: 1px solid #334155; }
  </style>
</head>
<body>
  <h1>BasinZig API + Paddle</h1>
  
  <label>User ID</label>
  <input id="userId" placeholder="test_user_123" />
  <label>Email</label>
  <input id="email" type="email" placeholder="test@email.com" />
  <button onclick="getKey()">1. Get API Key</button>
  <input id="apiKey" readonly />

  <h2>2. Upgrade</h2>
  <div class="tier">
    <button onclick="checkout('pri_01kyvnr0j567m2ns57cy0x58vw')">Pro Monthly $9</button>
    <button onclick="checkout('pri_01kyw5pdehq2ef6n88700pgksd')">Pro Annual $90</button>
  </div>

  <div id="output">Waiting...</div>

  <script>
    const API_URL = 'https://basin-zig-production.up.railway.app';
    
    // KEY: OVERRIDE + SANDBOX
    Paddle.Initialize({ 
      token: 'test_06a88ff0ae7e935e5566c4c3d36',
      environment: 'sandbox',
      checkout: {
        settings: {
          displayMode: "overlay",
          theme: "dark",
          allowThirdPartyCookies: true
        }
      }
    });

    function log(data) { document.getElementById('output').innerText = JSON.stringify(data, null, 2); }
    
    async function getKey() {
      const email = document.getElementById('email').value; 
      const user_id = document.getElementById('userId').value;
      const res = await fetch(`${API_URL}/apikey`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email, user_id }) });
      const data = await res.json(); 
      document.getElementById('apiKey').value = data.apiKey; 
      log(data);
    }

    function checkout(priceId) {
      const user_id = document.getElementById('userId').value; 
      const email = document.getElementById('email').value;
      if (!user_id || !email) return alert('Set user_id and email first');

      Paddle.Checkout.open({
        items: [{ priceId: priceId, quantity: 1 }],
        customer: { email: email },
        customData: { user_id: user_id },
        settings: { 
          successUrl: 'https://basin-zig-production.up.railway.app/welcome',
          displayMode: 'overlay'
        }
      });
    }
  </script>
</body>
</html>
