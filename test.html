<!DOCTYPE html>
<html>
<head>
  <title>Basin ZK API - Sandbox Test</title>
  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #000; color: #fff; border: none; border-radius: 6px; font-weight: 600; }
    button:hover { background: #333; }
    .pricing { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; flex: 1; min-width: 220px; text-align: center; }
    #output { background: #f5f5f5; padding: 15px; margin-top: 20px; white-space: pre-wrap; border-radius: 6px; font-size: 12px; }
    input { padding: 8px; margin: 5px; width: 250px; border: 1px solid #ccc; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Basin ZK API Test - SANDBOX</h1>

  <h2>1. Set User ID + Get API Key</h2>
  <input id="userId" placeholder="user_id e.g. user_123" />
  <input id="email" placeholder="email" />
  <button onclick="getKey()">Get Free Key</button>

  <h2>2. Upgrade</h2>
  <div class="pricing">
    <div class="card">
      <h3>Pro</h3>
      <button onclick="checkout('pro', 'monthly')">Pro Monthly</button>
      <button onclick="checkout('pro', 'annually')">Pro Annual</button>
    </div>
    <div class="card">
      <h3>Team</h3>
      <button onclick="checkout('team', 'monthly')">Team Monthly</button>
      <button onclick="checkout('team', 'annually')">Team Annual</button>
    </div>
    <div class="card">
      <h3>Unlimited</h3>
      <button onclick="checkout('unlimited', 'monthly')">Unlimited Monthly</button>
      <button onclick="checkout('unlimited', 'annually')">Unlimited Annual</button>
    </div>
  </div>

  <h2>3. Test API</h2>
  <input id="apiKey" placeholder="Your zk_... key" />
  <button onclick="checkUsage()">Check Usage</button>
  <button onclick="prove()">Test /prove</button>

  <div id="output"></div>

  <script>
    const API_URL = 'https://basin-zig-production.up.railway.app';

    // SANDBOX INIT
    Paddle.Setup({ 
      token: "test_06a88ff0ae7e935e5566c4c3d36",
      environment: "sandbox"
    });

    // YOUR 6 SANDBOX PRICE IDS
    const PRICES = {
      pro: { 
        monthly: 'pri_01kyvnr0j567m2ns57cy0x58vw',   
        annually: 'pri_01kyw5pdehq2ef6n88700pgksd'    
      },
      team: { 
        monthly: 'pri_01kyw65pmd1k05y7s943w9zn84',   
        annually: 'pri_01kyw67e9xdvx9sp0bx5q8270f'   
      },
      unlimited: { 
        monthly: 'pri_01kyw6b33c9q3bga83hnx0v28q',   
        annually: 'pri_01kyw6e6r9v9k27dfgtdmphv4f'   
      }
    };

    function log(data) {
      document.getElementById('output').innerText = JSON.stringify(data, null, 2);
    }

    async function getKey() {
      const email = document.getElementById('email').value;
      const user_id = document.getElementById('userId').value;
      if (!email || !user_id) return alert('Enter email + user_id');

      const res = await fetch(`${API_URL}/apikey`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, user_id })
      });
      const data = await res.json();
      document.getElementById('apiKey').value = data.apiKey;
      log(data);
    }

    function checkout(tier, billing) {
      const user_id = document.getElementById('userId').value;
      if (!user_id) return alert('Set user_id first');

      Paddle.Checkout.open({
        settings: {
          displayMode: 'overlay',  // 1-page overlay
          variant: 'one-page',
          successUrl: window.location.origin + '/welcome'
        },
        items: [{ priceId: PRICES[tier][billing], quantity: 1 }],
        customData: { user_id: user_id, tier: tier, billing: billing } // this goes to webhook
      });
    }

    async function checkUsage() {
      const key = document.getElementById('apiKey').value;
      const res = await fetch(`${API_URL}/usage`, { headers: { 'x-api-key': key } });
      log(await res.json());
    }

    async function prove() {
      const key = document.getElementById('apiKey').value;
      const res = await fetch(`${API_URL}/prove`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-api-key': key },
        body: JSON.stringify({ item: 'alice' })
      });
      log(await res.json());
    }
  </script>
</body>
</html>
