name: Build Basin Zig
on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build
        run: zig build --summary all

      - name: Test - Vectors + Properties
        run: zig build test --summary all

      - name: Run Example - Smoke
        run: zig build run -- "ci smoke run"

      - name: Run Bench + Threads - Stress
        run: zig build run -- --bench --threads 4 "ci stress run"