name: Build Basin Zig
on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Zig Version
        run: zig version

      - name: Build
        run: zig build --summary all

      - name: Run Tests
        run: zig build test --summary all

      - name: Run Example Single
        run: zig build run -- "ci run"

      - name: Run Example Bench + Threads
        run: zig build run --bench --threads 4 "ci run"