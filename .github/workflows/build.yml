name: Build Basin Zig
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Build
        run: zig build --summary all
      - name: Run Tests
        run: zig build test --summary all
      - name: Run Example Single
        run: zig build run -- "ci run" # this MUST pass
      - name: Run Example Bench/Threads
        run: zig build run -- --bench --threads 4 "ci run" 2>&1 | cat
        continue-on-error: true # yellow instead of red