name: Build Basin Zig
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Clean zig cache
        run: rm -rf.zig-cache zig-out

      - name: Build
        run: zig build

      - name: Run
        run: zig build run