name: CI

on: [push, pull_request]

jobs:
  zig-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Build and Test Native
        run: zig build test -Doptimize=ReleaseSafe

  valgrind:
    runs-on: ubuntu-latest
    needs: zig-test  
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build Artifacts for Valgrind
        run: zig build -Doptimize=ReleaseFast -Dinstall-tests=true -Dskip-heavy=true

      - name: Run Valgrind
        run: valgrind --leak-check=full --error-exitcode=1 ./zig-out/bin/basin-test

  wasm-api-test: # <-- NEW: This verifies the actual Merkle endpoint
    runs-on: ubuntu-latest
    needs: zig-test
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WASM
        run: zig build wasm # This fails if wasm.zig is broken

      - name: Install API deps
        run: cd api && npm i

      - name: Start API Server
        run: cd api && node server.js &
        
      - name: Wait for server
        run: sleep 3

      - name: Integration Test Merkle Prove
        run: |
          curl -f -X POST http://localhost:8080/v1/prove \
            -H "Content-Type: application/json" \
            -d '{"items":["test1","test2","test3"],"target_index":1}' \
            | grep -q "root" # fails if no root in response

      - name: Health Check
        run: curl -f http://localhost:8080/health