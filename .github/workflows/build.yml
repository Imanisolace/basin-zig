name: Build Basin Zig
on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with: { version: 0.13.0 }
      - run: zig build --summary all
      - run: zig build test --summary all
      - run: zig build run -- "ci smoke run"
      - run: zig build bench -Doptimize=ReleaseFast -- "ci stress run"

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with: { version: 0.13.0 }
      - run: zig build test -Doptimize=ReleaseFast --summary all
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address

  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with: { version: 0.13.0 }
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: zig build -Doptimize=ReleaseFast
      - run: zig build test -Doptimize=ReleaseFast -femit-bin=zig-out/bin/test
      - run: valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 zig-out/bin/test
      - run: valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 zig-out/bin/basin-example "valgrind check"