name: CI / Build and Test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.14.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Zig Build Files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'src/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ env.ZIG_VERSION }}-

      - name: Build Native Binaries
        run: zig build --summary all

      - name: Run Tests
        run: zig build test --summary all

      - name: Build WASM
        run: zig build wasm -Doptimize=ReleaseSmall --summary all

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: basin-wasm
          path: zig-out/bin/wasm/basin.wasm  # <-- FIXED PATH