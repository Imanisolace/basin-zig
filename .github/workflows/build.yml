name: Build Basin Zig
on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.13.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Build
        run: zig build --summary all

      - name: Test
        run: zig build test --summary all

      - name: Run Example
        run: zig build run -- "ci run"

      - name: Run Bench + Threads
        run: zig build run -- --bench --threads 4 "ci run"