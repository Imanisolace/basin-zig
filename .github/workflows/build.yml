name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ZIG_VERSION: 0.14.0

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dskip-heavy=true

      - name: Run tests
        run: zig build test -Doptimize=ReleaseSafe -Dskip-heavy=true

      - name: Run tests with Valgrind
        run: valgrind --leak-check=full --error-exitcode=1 ./zig-out/bin/basin-test

      - name: Build WASM
        run: zig build wasm -Doptimize=ReleaseSmall